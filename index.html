<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>𝓥𝓐𝓜𝓟𝓘𝓡</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --page-bg: #f3f4ff;
      --page-text-main: #020617;
      --page-text-sub: #374151;
      --accent: #1d4ed8;
      --card-bg: #ffffff;
      --card-bg-hover: #e0ebff;
      --card-border: #d1d5db;
      --card-radius: 18px;
      --shadow-main: 0 12px 32px rgba(15, 23, 42, 0.16);
      --shadow-hover: 0 18px 44px rgba(37, 99, 235, 0.40);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--page-text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .page {
      max-width: 960px;
      width: 100%;
      padding: 20px 16px 32px;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left { min-width: 0; }

    .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 13px; color: var(--page-text-sub); }

    .grid-header {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .folder {
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(248, 250, 252, 0.85);
      margin-top: 12px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.12);
    }
    .folder-header {
      width: 100%;
      border: none;
      outline: none;
      padding: 10px 14px;
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.1), rgba(129, 140, 248, 0.12));
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .folder-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }
    .folder-title span {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      color: #0f172a;
    }
    .folder-toggle {
      font-size: 11px;
      color: #1d4ed8;
    }
    .folder-body {
      padding: 10px 10px 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.4);
    }
    .folder-body.collapsed { display: none; }

    .grid {
      margin-top: 4px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 16px 14px 14px;
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: var(--page-text-main);
      box-shadow: var(--shadow-main);
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }
    .card:hover {
      background: var(--card-bg-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .card-main {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-text {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: var(--page-text-sub);
      margin-bottom: 4px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--page-text-sub);
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      font-size: 12px;
      font-weight: 600;
      color: var(--page-text-main);
      background: rgba(15, 23, 42, 0.04);
    }
    .badge-accent {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.2);
    }

    footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--page-text-sub);
      border-top: 1px solid #020617;
      padding-top: 10px;
      text-align: right;
    }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 480px) {
      .page { padding: 16px 12px 24px; }
      .title { font-size: 20px; }
      .card { padding: 14px 12px 12px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    const gridContainer = document.getElementById("cardGrid");
    document.getElementById("year").textContent = new Date().getFullYear();

    function createCardElement(card) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = card.url || "#";
      a.target = "_blank";
      a.rel = "noopener";

      const main = document.createElement("div");
      main.className = "card-main";

      if (card.image) {
        const icon = document.createElement("div");
        icon.className = "card-icon";
        const img = document.createElement("img");
        img.src = card.image;
        icon.appendChild(img);
        main.appendChild(icon);
      }

      const textWrap = document.createElement("div");
      textWrap.className = "card-text";

      const titleEl = document.createElement("div");
      titleEl.className = "card-title";
      titleEl.textContent = card.title || "";

      const descEl = document.createElement("div");
      descEl.className = "card-desc";
      descEl.textContent = card.desc || "";

      textWrap.appendChild(titleEl);
      textWrap.appendChild(descEl);
      main.appendChild(textWrap);

      const meta = document.createElement("div");
      meta.className = "card-meta";

      const badgeEl = document.createElement("div");
      badgeEl.className = "badge" + (card.badgeAccent ? " badge-accent" : "");
      badgeEl.textContent = card.badge || "";

      const hostEl = document.createElement("div");
      hostEl.textContent = card.host || "";

      meta.appendChild(badgeEl);
      meta.appendChild(hostEl);

      a.appendChild(main);
      a.appendChild(meta);

      return a;
    }

        if (!grouped[g]) grouped[g] = [];
        grouped[g].push(card);
      });

      groupDefs.forEach(function (g) {
        const items = grouped[g.key];
        if (!items || !items.length) return;

        const folder = document.createElement("div");
        folder.className = "folder";

        const header = document.createElement("button");
        header.type = "button";
        header.className = "folder-header";

        const title = document.createElement("div");
        title.className = "folder-title";
        title.innerHTML = g.icon + " " + g.label;
        const chip = document.createElement("span");
        chip.textContent = items.length + "개";
        title.appendChild(chip);

        const toggleLabel = document.createElement("div");
        toggleLabel.className = "folder-toggle";
        toggleLabel.textContent = "펼치기";

        header.appendChild(title);
        header.appendChild(toggleLabel);

        const body = document.createElement("div");
        body.className = "folder-body collapsed";

        const grid = document.createElement("div");
        grid.className = "grid";

        items.forEach(function (card) {
          grid.appendChild(createCardElement(card));
        });

        body.appendChild(grid);

        header.addEventListener("click", function () {
          const collapsed = body.classList.toggle("collapsed");
          toggleLabel.textContent = collapsed ? "펼치기" : "접기";
        });

        folder.appendChild(header);
        folder.appendChild(body);
        gridContainer.appendChild(folder);
      });
    }

    renderCards();
  </script>
</body>
</html>
